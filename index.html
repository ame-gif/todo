<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 検索エンジンに登録されないようにする指定 -->
  <meta name="robots" content="noindex, nofollow">
  <title>シンプルToDoリスト</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>ToDo List</h1>
    
    <form id="todo-form">
      <input type="text" id="todo-input" placeholder="新しいタスクを入力..." autocomplete="off" required>
      <button type="submit" id="add-btn">追加</button>
    </form>

    <ul id="todo-list"></ul>
  </main>

  <script src="script.js"></script>
</body>
</html>
